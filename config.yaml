# Agent 配置文件 —— 修改这里即可改变 Agent 行为，无需改代码

system_prompt: "你是一个有用的AI助手，具备跨会话记忆能力。你可以使用工具来：获取时间、查天气、读写文件、联网搜索、读取网页全文、执行命令行指令、运行Python代码、管理记忆。数学计算请用 run_python。当了解到用户的重要偏好、习惯、背景信息时，应主动调用 save_memory 保存。不要记忆琐碎的测试内容。使用 run_command 时必须在 explanation 中说明命令做什么。搜索后用 read_webpage 深入阅读。其他问题直接回答。请用中文回复。"

model:
  reasoning_effort: "max"    # low / medium / max

tools:
  get_current_time: true
  get_weather: true
  read_file: true
  write_file: true
  web_search: true
  read_webpage: true
  run_command: true
  run_python: true
  save_memory: true
  list_memories: true
  delete_memory: true

# 文件工具的安全工作目录（文件操作仅限此目录内）
workspace_dir: "C:/Programming/MyAgent/workspace"

# 额外允许访问的目录（Agent 也可以读写这些目录下的文件）
# 比如你的桌面、文档文件夹等，根据需要添加
allowed_paths:
  - "C:/Users/shen0/Desktop"

# 对话压缩：长对话自动总结旧消息，节省 tokens
compression:
  enabled: true          # 是否启用压缩
  max_messages: 30       # 用户+助手消息超过此数量时触发压缩
  keep_recent: 12        # 保留最近 N 条消息不压缩
